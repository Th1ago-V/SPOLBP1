<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h1>Cadastro de Produtos</h1>
        <form id="formProduto">
            <label for="nome">
                Nome do Produto:
            </label>
            <input type="text" id="nome" name="nome" minlength="3" maxlength="100" required>
            <label for="categoria">
                Categoria:
            </label>
            <select id="categoria" name="categoria" required>
                <option value="">
                    Selecione uma categoria
                </option>
                <option value="Informática">
                    Informática
                </option>
                <option value="Eletrônicos">
                    Eletrônicos
                </option>
                <option value="Alimentos">
                    Alimentos
                </option>
                <option value="Limpeza">
                    Limpeza
                </option>
                <option value="Papelaria">
                    Papelaria
                </option>
                <option value="Outros">
                    Outros
                </option>
            </select>
            <label for="quantidade">
                Quantidade:
            </label>
            <input type="number" id="quantidade" name="quantidade" min="1" required>
            <label for="preco">
                Preço:
            </label>
            <input type="number" id="preco" name="preco" min="0.01" step="0.01" required>
            <label for="fabricante">
                Fabricante:
            </label>
            <input type="text" id="fabricante" name="fabricante" minlength="2" maxlength="100" required>
            <button type="submit">
                Cadastrar Produto
            </button>
        </form>
        <p id="mensagem"></p>
        <h2>Produtos Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Quantidade</th>
                    <th>Preço</th>
                    <th>Fabricante</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaProdutos">
            </tbody>
        </table>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
