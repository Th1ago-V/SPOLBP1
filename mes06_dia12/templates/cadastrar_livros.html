<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Livro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow max-width mx-auto" style="max-width: 600px;">
            <div class="card-header bg-primary text-white"><h3>Cadastrar Novo Livro</h3></div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3"><label class="form-label">Título</label><input type="text" name="titulo" class="form-control" required></div>
                    <div class="row">
                        <div class="col-md-4 mb-3"><label class="form-label">Autor 1</label><input type="text" name="autor1" class="form-control" required></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Autor 2</label><input type="text" name="autor2" class="form-control"></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Autor 3</label><input type="text" name="autor3" class="form-control"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">ISBN</label><input type="text" name="isbn" class="form-control"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Assunto</label><input type="text" name="assunto" class="form-control"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3"><label class="form-label">Edição</label><input type="text" name="edicao" class="form-control"></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Editora</label><input type="text" name="editora" class="form-control"></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Ano</label><input type="number" name="ano" class="form-control"></div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Salvar Livro</button>
                </form>
                <hr>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary w-100">Voltar ao Menu</a>
            </div>
        </div>
    </div>
</body>
</html>
