<!DOCTYPEdoctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Biblioteca Web</a>
            <span class="navbar-text text-white">Olá, {{ usuario }}!</span>
            <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm ms-3">Sair</a>
        </div>
    </nav>
    <div class="container mt-5 text-center">
        <h1 class="mb-4">Menu Principal</h1>
        <div class="row justify-content-center g-4">
            <div class="col-md-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Novo Livro</h5>
                        <p class="card-text">Adicionar novos exemplares ao acervo.</p>
                        <a href="{{ url_for('cadastrar_livro') }}" class="btn btn-primary">Cadastrar</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Consultar</h5>
                        <p class="card-text">Ver, excluir ou exportar acervo existente.</p>
                        <a href="{{ url_for('consultar_livros') }}" class="btn btn-success">Acessar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
